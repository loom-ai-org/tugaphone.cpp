name: CI

on:
  push:
    branches: [dev, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        # x86-64-v3 has FMA: the cell fails if a multiply-add is fused.
        march: [baseline, x86-64-v3]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libboost-dev libicu-dev
      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then export CXX=clang++; else export CXX=g++; fi
          if [ "${{ matrix.march }}" != baseline ]; then flags="-march=${{ matrix.march }}"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/prefix" \
            -DCMAKE_CXX_FLAGS="${flags:-}"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4
      - name: Install and build a consumer
        run: |
          cmake --install build
          cmake -S tests/package_consumer -B consumer -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build consumer
          ./consumer/consumer

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libboost-dev libicu-dev
      - name: Build with ASan and UBSan
        run: |
          CXX=clang++ cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-O1 -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 1800 -j 4

  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libboost-dev libicu-dev
      # ThreadSanitizer cannot map its shadow memory with the runner's default ASLR entropy.
      - name: Lower the ASLR entropy
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Build with TSan
        run: |
          CXX=clang++ cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-O1 -g -fsanitize=thread"
          cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure -R '^threads_'
